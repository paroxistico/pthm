<!DOCTYPE html>
<html lang=" 그리고 "es">
<head>
    <meta charset="UTF-8">
    <meta name pair="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texas Hold'em Poker Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <!-- Pantalla de Inicio / Overlay -->
        <div id="overlay">
            <h1>Texas Hold'em</h1>
            <button id="start-btn">Empezar Partida</button>
        </div>

        <!-- Mesa de Juego -->
        <div id="poker-table">
            <div class="community-cards" id="community-cards"></div>
            
            <!-- Jugadores (Posiciones fijas) -->
            <div class="player" id="player-0" data-role="human">
                <div class="card-slot"></div>
                <div class="player-info">
                    <span class="name">Tú</span>
                    <span class="chips">1000€</span>
                </div>
            </div>

            <div class="player" id="player-1" data-role="cpu">
                <div class="card-slot"></div>
                <div class="player-info">
                    <span class="name">Bot 1</span>
                    <span class="chips">1000€</span>
                </div>
            </div>

            <div class="player" id="player-2" data-role="cpu">
                <div class="card-slot"></div>
                <div class="player-info">
                    <span class="name">Bot 2</span>
                    <span class="chips">1000€</span>
                </div>
            </div>

            <div class="player" id="player-3" data-role="cpu">
                <div class="card-slot"></div>
                <div class="player-info">
                    <span class="name">Bot 3</span>
                    <span class="chips">1000€</span>
                </div>
            </div>

            <!-- Acciones del Jugador -->
            <div id="controls" class="hidden">
                <button onclick="game.fold()">Fold</button>
                <button onclick="game.call()">Check/Call</button>
                <button onclick="game.raise()">Raise</button>
            </div>

            <!-- Log de mensajes -->
            <div id="status-log"></div>
        </div>
    </div>

    <!-- Audio de fondo -->
    <audio id="bg-music" loop>
        <source src="assets/music/Minecraft Sweden.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
