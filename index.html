<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Texas Hold'em Poker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Contenedor principal que escalaremos con CSS para el efecto de "zoom" en móvil -->
    <div id="game-wrapper">
        <div id="game-container">
            <div id="table-area">
    <img src="assets/images/tapete.png" id="poker-table" alt="Mesa de Poker">
    
    <!-- Cartas comunitarias en el centro -->
    <div id="community-cards" class="card-row"></div>

    <!-- Posiciones de los 6 jugadores (El 6 es el humano) -->
    <div id="player-1" class="player-slot"></div>
    <div id="player-2" class="player-slot"></div>
    <div id="player-3" class="player-slot"></div>
    <div id="player-4" class="player-slot"></div>
    <div id="player-5" class="player-slot"></div>
    <div id="player-6" class="player-slot human"></div> <!-- JUGADOR HUMANO -->
</div>
            </div>
        </div>
    </div>

    <!-- Audio para música de fondo -->
    <audio id="bg-music" loop>
        <source src="assets/music/Minecraft Sweden.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
