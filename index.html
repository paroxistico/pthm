<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Texas Hold'em Poker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Contenedor principal que escalaremos con CSS para el efecto de "zoom" en móvil -->
    <div id="game-wrapper">
        <div id="game-container">
            <div id="table-area">
                <img src="assets/images/poker_table.png" id="poker-table" alt="Mesa de Poker">
                <div id="cards-display"></div> <!-- Aquí aparecerán las cartas -->
            </div>

            <div id="ui-layer">
                <div id="status-msg">¡Bienvenido al Poker!</div>
                <div id="controls-container" class="hidden">
                    <button onclick="handleAction('fold')" class="btn btn-red">Retirarse</button>
                    <button onclick="handleAction('call')" class="btn btn-green">Pagar</button>
                    <button onclick="handleAction('raise')" class="btn btn-blue">Subir</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Audio para música de fondo -->
    <audio id="bg-music" loop>
        <source src="assets/music/poker_theme.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
