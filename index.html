<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="screen-orientation" content="landscape">
    <title>Texas Hold'em Poker</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/Back-R.png">
</head>
<body>
    <div id="start-overlay" class="overlay active">
        <button id="btn-start">🃏 Iniciar Partida</button>
        <p>Gira el dispositivo a horizontal si es necesario.</p>
    </div>

    <main id="game-container">
        <section class="table-surface"></section>
        <div id="community-cards" class="card-row"></div>

        <section id="pot-info">
            <span>Pozo: $<strong id="current-pot">0</strong></span>
            <small>Ciega: <span id="blinds-display">$10/$20</span></small>
        </section>

        <div id="players-container"></div>
        <div id="deck-source" class="hidden">🂠</div>

        <section id="controls-panel">
            <button id="btn-check-call" data-action="check-call" disabled>Chequear/Ligar</button>
            <button id="btn-raise" data-action="raise" disabled>Apostar $<span class="bet-amount"></span></button>
            <button id="btn-fold" data-action="fold" disabled>Doblar</button>
        </section>
    </main>

    <audio id="bg-music" loop preload="auto">
        <source src="assets/music/Minecraft Sweden.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
